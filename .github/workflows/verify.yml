name: Build and browser checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Check generated source is committed
        run: git diff --exit-code -- '*.html' assets/js/cities assets/js/details assets/css/themes.css data/food-guide.json sitemap.xml robots.txt manifest.webmanifest service-worker.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:audit
      - run: npm run test:food
